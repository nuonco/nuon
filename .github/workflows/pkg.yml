# workflow jobs for testing/linting and verifying changes to go packages
---
name: pkg
"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: read
  packages: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: 🔍 changes
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pkg:
              - 'pkg/**'
              - .github/workflows/pkg.yml
              - go.mod
              - go.sum
  # TODO: add lint job once .golangci.yml is migrated to v2 format
  test:
    name: 🌏 test
    needs: changes
    if: ${{ needs.changes.outputs.pkg == 'true' }}
    runs-on: build-only
    env:
      NO_REMOTE_BUILDKIT: ${{ contains(github.event.pull_request.labels.*.name, 'no-remote-buildkit') }}
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: FranzDiebold/github-env-vars-action@v2

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup nuonctl
        uses: ./actions/setup-nuonctl

      - name: Setup BuildKit
        if: ${{ env.NO_REMOTE_BUILDKIT != 'true' }}
        run: |
          CI=true nuonctl builds driver ctl-api && nuonctl builds driver-health ctl-api || docker buildx ls

      - name: 🧪 Tests
        run: |
          CACHE_ARGS=()
          if [[ "${IS_FORK_PR}" != "true" ]]; then
            CACHE_ARGS=(--write-cache --max-mode)
          fi
          CI=true nuonctl tests run-all pkg "${CACHE_ARGS[@]}"

      - name: Save Go build cache to S3
        if: ${{ env.IS_FORK_PR != 'true' }}
        run: CI=true nuonctl builds gocache pkg --tag=${{ github.event.pull_request.head.sha || github.sha }}
        env:
          AWS_REGION: us-west-2

  update_status:
    name: update status
    needs:
      - test
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: martialonline/workflow-status@v4.2
        id: check
      - name: Update status
        uses: ouzi-dev/commit-status-updater@v2.0.1
        with:
          name: pkg ✅
          status: ${{steps.check.outputs.status}}
