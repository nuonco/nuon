name: telemetry-agent
on:
  pull_request:
    paths:
      - bins/telemetry-agent/**
      - pkg/telemetryexport/**
      - sdks/nuon-runner-go/**
      - services/ctl-api/**
      - go.mod
      - go.sum
      - .github/workflows/telemetry-agent.yml
  push:
    branches: [main]
    paths:
      - bins/telemetry-agent/**
      - pkg/telemetryexport/**
      - sdks/nuon-runner-go/**
      - services/ctl-api/**
      - go.mod
      - go.sum
      - .github/workflows/telemetry-agent.yml

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bins/telemetry-agent/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=telemetry-agent
          cache-to: type=gha,mode=max,scope=telemetry-agent
