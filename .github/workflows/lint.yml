---
name: lint
"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: read
  packages: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}

defaults:
  run:
    shell: bash

jobs:
  ast-grep:
    name: ast-grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Run ast-grep scan
        run: sg scan services/ pkg/ --filter no-fmt-println

  go-fmt:
    name: go fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$HOME/.local/bin" v2.14.0

      - name: Check formatting
        run: |
          if ! "$HOME/.local/bin/golangci-lint" fmt --diff; then
            echo "::error::Go files are not formatted. Run: golangci-lint fmt"
            exit 1
          fi

  update_status:
    name: update status
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    needs: [ast-grep, go-fmt]
    steps:
      - name: Update status
        uses: ouzi-dev/commit-status-updater@v2.0.1
        with:
          name: lint ✅
          status: success
