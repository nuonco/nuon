---
name: branch checks
on:
  pull_request:
    types: ["opened", "edited", "synchronize"]
  merge_group:

permissions:
  actions: read
  statuses: write

jobs:
  update_status:
    name: update status
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && always()
    runs-on: ubuntu-latest
    steps:
      - uses: martialonline/workflow-status@v4.2
        id: check
      - name: Update status
        uses: ouzi-dev/commit-status-updater@v2.0.1
        with:
          name: branch ✅
          status: ${{steps.check.outputs.status}}
