---
name: Manual Promotion

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to promote from'
        required: true
        default: 'main'
      version:
        description: 'Version tag to use for promotion (optional)'
        required: false

permissions:
  contents: write
  id-token: write
  issues: read
  packages: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: manual-${{ github.workflow }}-${{ github.event.inputs.branch }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Setup promotion
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{steps.git_ref.outputs.git_ref}}
      semver: ${{ inputs.version || steps.semver.outputs.nextStrict }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set git_ref output
        id: git_ref
        run: echo "git_ref=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Determine next version
        id: semver
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_DEPLOY_TOKEN }}
        run: |
          # Get latest semver tag from this repo
          LOCAL_LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          # Get latest semver tag from sibling repo (nuonco/mono - private)
          SIBLING_LATEST=$(gh api repos/nuonco/mono/tags --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          echo "Local latest: ${LOCAL_LATEST:-none}"
          echo "Sibling latest: ${SIBLING_LATEST:-none}"

          # Take the highest version across both repos
          MAX_VERSION=$(printf '%s\n' "${LOCAL_LATEST:-v0.0.0}" "${SIBLING_LATEST:-v0.0.0}" | sort -V | tail -1)
          echo "Max version across repos: ${MAX_VERSION}"

          # Bump patch version
          VERSION="${MAX_VERSION#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "Next version: ${NEXT_VERSION}"
          echo "nextStrict=${NEXT_VERSION}" >> $GITHUB_OUTPUT

  start_slack_notifications:
    name: Update promotions channel
    needs:
      - tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_ICON_EMOJI: 🤖
          SLACK_USERNAME: github-bot
          SLACK_WEBHOOK: ${{ secrets.PROMOTIONS_SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ⛴  *MANUAL PROMOTION* from branch `${{ github.event.inputs.branch }}` `${{ needs.tag.outputs.git_ref }}` to `${{needs.tag.outputs.semver}}`
            *version* - ${{ needs.tag.outputs.semver }}
            *services* - all
            *stage* - true
            *prod* - true

  services:
    name: 🚢 ${{ matrix.service }}
    needs:
      - tag
    strategy:
      fail-fast: false
      matrix:
        service: ['ctl-api', 'dashboard-ui', 'runner', 'cli', 'wiki']
    uses: ./.github/workflows/service.yml
    with:
      service: ${{matrix.service}}
      tag: ${{ needs.tag.outputs.semver }}
      prod: true
      stage: true
      is_promotion: true
      disable_github_oidc: ${{ github.repository != 'nuonco/nuon' }}
    secrets: inherit

  bump_tag:
    name: Bump tag
    needs:
      - tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          
      - name: Push tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ needs.tag.outputs.semver }}

  update_statuses:
    name: Update statuses
    needs:
      - tag
      - services
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          
      - uses: martialonline/workflow-status@v4.2
        id: check
        
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_ICON_EMOJI: 🤖
          SLACK_USERNAME: github-bot
          SLACK_WEBHOOK: ${{ secrets.PROMOTIONS_SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{steps.check.outputs.status}}
          SLACK_MESSAGE: |
            ${{ steps.check.outputs.status == 'success' && '🏁🏁' || '🚨🚨' }} **MANUAL PROMOTION** finished from branch `${{ github.event.inputs.branch }}` `${{ needs.tag.outputs.git_ref }}` to `${{ needs.tag.outputs.semver }}`
            *version* - ${{ needs.tag.outputs.semver }}
            *stage* - true
            *prod* - true
            *status* - ${{steps.check.outputs.status}}

      - name: Update datadog
        uses: masci/datadog@v1
        with:
          api-key: ${{ secrets.DATADOG_API_KEY }}
          api-url: "https://us5.datadoghq.com"
          metrics: |
            - type: "count"
              name: "promotions.count"
              value: 1.0
              host: ${{ github.repository_owner }}
              tags:
                - "branch:${{ github.event.inputs.branch }}"
                - "status:${{ steps.check.outputs.status }}"
                - "version:${{ needs.tag.outputs.semver }}"
                - "type:manual"
                - "env:stage"

  promote_success:
    name: Promote success
    needs:
      - tag
      - bump_tag
      - services
    if: ${{ success() }}
    uses: ./.github/workflows/promote_success.yml
    with:
      tag: ${{ needs.tag.outputs.semver }}
    secrets: inherit
