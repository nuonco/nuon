---
name: ctl-api integration
"on":
  workflow_dispatch:
    inputs:
      local_nctl:
        description: "Build nuonctl from mono main instead of pulling :latest"
        type: boolean
        default: false
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# A new push supersedes the in-flight run instead of stacking lanes behind it.
concurrency:
  group: ctl-api-integration-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  CI: "true"
  NUON_ROOT: ${{ github.workspace }}
  NUONCTL_LOCAL: ${{ inputs.local_nctl || false }}
  NUONCTL_DISABLE_CREDENTIALS: "true"
  NUONCTL_CLUSTER_ROLE_ARN: arn:aws:iam::676549690856:role/github-actions-role-stage-nuon

jobs:
  changes:
    name: 🔍 changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout repo
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          sparse-checkout: ci-triggers.yml
          sparse-checkout-cone-mode: false

      - name: read ci triggers file
        if: github.event_name != 'workflow_dispatch'
        uses: pietrobolcato/action-read-yaml@1.1.0
        id: ci_triggers
        with:
          config: ci-triggers.yml

      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            ${{ steps.ci_triggers.outputs['services'] }}
            integration-workflow:
              - .github/workflows/ctl-api-integration.yml

      - name: Decide whether to run the lanes
        id: decide
        run: |
          run=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run=true
          elif [[ "${{ github.event.pull_request.head.repo.full_name || github.repository }}" != "${{ github.repository }}" ]]; then
            reason="fork PR; the lanes need mono and stage credentials, which forks do not get"
          elif [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            reason="draft PR; integration run skipped until marked ready for review"
          elif [[ "${{ github.triggering_actor }}" == "nuonbot" ]]; then
            reason="bot merge; the merged result is tested by the main-push run"
          elif [[ "${{ steps.filter.outputs['ctl-api'] }}" == "true" || "${{ steps.filter.outputs['integration-workflow'] }}" == "true" ]]; then
            run=true
          else
            reason="no ctl-api changes in this diff"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "run=$run ${reason:+($reason)}"

  # The flow lane boots its own fx app (psql + temporal worker + flow client) in-process, so it
  # needs only the docker deps and a migrated ctl_api_test, which nuontest prepares.
  flow-lane:
    name: flow lane
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: build-run-lane
    timeout-minutes: 30
    steps:
      - name: Checkout nuon
        uses: actions/checkout@v6
        with:
          path: nuon

      - name: Checkout mono
        uses: actions/checkout@v6
        with:
          repository: nuonco/mono
          ref: main
          path: mono
          token: ${{ secrets.NUON_BOT_GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: nuon/go.mod
          cache-dependency-path: nuon/go.sum

      - name: Bring up dependencies (postgres / temporal / clickhouse)
        working-directory: mono
        run: |
          nohup sh -c '
            docker compose down -v --remove-orphans || true
            CHVER=25.6.2.5 docker compose up -d --build postgres temporal temporal-init clickhouse
            echo $? > /tmp/deps-up.exit
          ' > /tmp/deps-up.log 2>&1 &

      # temporal-gen wrappers (*_gen.go) are not tracked in git.
      - name: Generate code
        working-directory: nuon
        run: |
          go mod download
          go generate ./...

      - name: Wait for dependencies
        run: |
          for i in $(seq 1 90); do
            [ -f /tmp/deps-up.exit ] && break
            sleep 2
          done
          tail -n 30 /tmp/deps-up.log || true
          [ -f /tmp/deps-up.exit ] && [ "$(cat /tmp/deps-up.exit)" = "0" ] || {
            echo "deps did not come up"
            exit 1
          }

      - name: Restore postgres schema snapshot
        uses: actions/cache@v6
        with:
          path: /tmp/schema-dump
          key: pg-schema-${{ runner.os }}-${{ hashFiles('nuon/services/ctl-api/internal/pkg/db/psql/**', 'nuon/services/ctl-api/internal/app/**/*.go', 'nuon/services/ctl-api/tests/testdb.go') }}

      # build-run pods are single-tenant on m6id.2xlarge (~7.75 allocatable vCPU), so -parallel=8
      # with DB_MAX_CONNECTIONS=32 (pgx pool for 8 concurrent flow cases) matches the node.
      - name: Run flow lane
        working-directory: nuon/services/ctl-api
        env:
          DB_REPLICA_ENABLED: "false"
          DB_MAX_CONNECTIONS: "32"
          NUON_FLOW_PHASE_LEDGER: "1"
          NUONTEST_PG_SCHEMA_DIR: /tmp/schema-dump
        run: |
          source tests/integration.env
          go run ./cmd/nuontest -v -timeout=30m -count=1 -parallel=8 \
            -skip 'TestSuite/TestPin' \
            ./internal/pkg/flow/testworker/

      - name: Dump deps state on failure
        if: failure()
        working-directory: mono
        run: |
          echo "::group::docker compose ps"
          docker compose ps || true
          echo "::endgroup::"
          echo "::group::recent ctl-api test logs"
          tail -n 200 /tmp/nuontest-shard0-tests-*.log 2>/dev/null || true
          echo "::endgroup::"

  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: build-run
    timeout-minutes: 60
    steps:
      - name: Checkout nuon
        uses: actions/checkout@v6
        with:
          path: nuon

      - name: Checkout mono
        uses: actions/checkout@v6
        with:
          repository: nuonco/mono
          ref: main
          path: mono
          token: ${{ secrets.NUON_BOT_GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: mono/go.mod
          cache-dependency-path: |
            mono/go.sum
            nuon/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The dev stack's ctl-api service runs bins/nuonctl/scripts/bun-install-if-needed on the
      # host, so bun must be on PATH.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install nuonctl
        run: |
          set -euo pipefail
          if [[ "${NUONCTL_LOCAL}" == "true" ]]; then
            (cd mono/bins/nuonctl && CGO_ENABLED=0 go build -o /usr/local/bin/nuonctl .)
          else
            base=https://nuon-artifacts.s3.us-west-2.amazonaws.com/nuonctl
            version="$(curl -sSf "$base/latest.txt")"
            curl -sSfL "$base/$version/nuonctl_linux_amd64" -o /usr/local/bin/nuonctl
            chmod +x /usr/local/bin/nuonctl
          fi
          nuonctl version

      - name: Bring up dependencies (postgres / temporal / clickhouse)
        working-directory: mono
        run: printf 'n\n' | nuonctl scripts go-reset-dependencies

      - name: Start ctl-api dev stack
        working-directory: mono
        env:
          NUON_DIR: ${{ github.workspace }}/nuon
        run: |
          nohup nuonctl service dev --dev=ctl-api --skip-all --watch=false --webview=false --quiet=false \
            > /tmp/dev.log 2>&1 &
          echo "DEV_PID=$!" >> $GITHUB_ENV

      # The untracked temporal-gen wrappers are required to compile the test tree; codegen overlaps
      # the dev stack's boot above.
      - name: Generate code
        working-directory: nuon
        run: |
          go mod download
          go generate ./...

      - name: Wait for ctl-api ready (up to 15m)
        run: |
          for i in {1..180}; do
            if curl -sf http://localhost:8081/livez \
               && curl -sf http://localhost:8082/livez; then
              echo "ctl-api ready after ${i} attempts ($((i*5))s)"
              exit 0
            fi
            # A dead dev process (e.g. OOM-killed during the ctl-api build) will never serve /livez.
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "ctl-api dev process (pid $DEV_PID) died after $((i*5))s of waiting"
              break
            fi
            if (( i % 12 == 0 )); then
              echo "--- still waiting (${i} attempts): pid $DEV_PID alive, $(free -m | awk '/Mem:/{print $3"/"$7" MiB used/avail"}'), last dev.log line:"
              tail -n 1 /tmp/dev.log || true
            fi
            sleep 5
          done
          echo "ctl-api never came up"
          echo "::group::ctl-api boot diagnostics"
          if kill -0 "$DEV_PID" 2>/dev/null; then
            ps -p "$DEV_PID" -o pid,ppid,stat,rss,etime,cmd || true
            pgrep -lP "$DEV_PID" || true
          else
            echo "dev process (pid $DEV_PID) is dead — crashed silently or was OOM-killed"
          fi
          free -m || true
          tail -n 30 /tmp/dev.log || true
          echo "::endgroup::"
          exit 1

      - name: Run integration tests
        working-directory: nuon/services/ctl-api
        env:
          INTEGRATION: "true"
          INTEGRATION_API_URL: http://localhost:8081
          INTEGRATION_INTERNAL_API_URL: http://localhost:8082
          INTEGRATION_NO_CLEANUP: "1"
          DB_REPLICA_ENABLED: "false"
        run: |
          source tests/integration.env
          mapfile -t packages < <(
            rg -l 'INTEGRATION' . --glob '*_test.go' \
              | xargs -n1 dirname \
              | sort -u
          )
          go run ./cmd/nuontest -v -timeout=40m -count=1 -p=1 \
            -skip 'TestSuite/TestPin' "${packages[@]}"

      - name: Dump dev logs on failure
        if: failure()
        working-directory: mono
        run: |
          echo "::group::nuonctl service dev (/tmp/dev.log)"
          tail -n 500 /tmp/dev.log || true
          echo "::endgroup::"
          echo "::group::docker compose ps"
          docker compose ps || true
          echo "::endgroup::"

      - name: Stop dev stack
        if: always()
        working-directory: mono
        run: |
          [ -n "${DEV_PID:-}" ] && kill "$DEV_PID" 2>/dev/null || true
          docker compose down -v || true

  # Required check on main (infra/github/repos_nuon.tf in mono). Always runs so skipped lanes
  # report success instead of leaving the check missing.
  result:
    name: ctl-api integration (mono)
    needs: [changes, flow-lane, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "change detection ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run }}" != "true" ]]; then
            echo "skipped: ${{ needs.changes.outputs.reason }}"
            [[ "${{ needs.changes.outputs.reason }}" != fork* ]]
            exit
          fi
          echo "flow lane: ${{ needs.flow-lane.result }}, integration: ${{ needs.integration.result }}"
          [[ "${{ needs.flow-lane.result }}" == "success" && "${{ needs.integration.result }}" == "success" ]]
