---
type: artifact
color: red
health_checks:
  - http://localhost:3333/get-started/introduction
env: {}
env_secrets: {}
disable_watch: true
local_startup_cmds: []
local_cmds:
  - ./dev.sh
disable_config_map: true
docker_cmds:
  - cmd: mint
    args:
      - dev
      - --port=3333
    ports:
      - 3333