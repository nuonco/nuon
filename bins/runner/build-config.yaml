---
dist:
  name: nuon-runner-otelcol
  description: Nuon Runner Telemetry Export Collector
  otelcol_version: 0.162.0
  output_path: ./otelcol-build
  version: 1.0.0
  module: github.com/nuonco/nuon/bins/runner/otelcol

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.162.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.162.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.162.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.162.0

replaces:
  - golang.org/x/crypto => golang.org/x/crypto v0.58.0
  - golang.org/x/net => golang.org/x/net v0.61.0
  - golang.org/x/text => golang.org/x/text v0.43.0
  - google.golang.org/grpc => google.golang.org/grpc v1.84.0
