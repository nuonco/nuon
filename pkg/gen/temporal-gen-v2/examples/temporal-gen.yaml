# temporal-gen-v2 tag config.
#
# Discovered by walking up from the directory being generated, stopping at the
# module root. Override with --config, or disable with --no-config. Library
# callers can declare the same vocabulary in Go instead, via Options.Tags.
#
# Tags are names set on an *activity* with `@tag <name>`. This file declares
# which tags exist and the default options each one implies. Tags do not apply
# to workflows.
#
# Attribute names are the annotation names with the leading "@" stripped, so
# there is one vocabulary. Precedence, lowest to highest:
#
#   defaults -> tags (in source order) -> @annotations on the activity ->
#   call-site opts passed to Await...

version: 1

# Applied to every annotated activity, ahead of any tag.
defaults:
  start-to-close-timeout: 1m

tags:
  db-read:
    start-to-close-timeout: 30s
    max-retries: 3

  bulk:
    start-to-close-timeout: 1h
    schedule-to-close-timeout: 6h
    heartbeat-timeout: 1m

  critical:
    max-retries: 870

  best-effort:
    max-retries: 3
