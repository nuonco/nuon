[project]
name = "nuon-ext-install-config-history"
version = "0.1.0"
description = "Browse and diff an install's app branch configuration history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.9",
    "textual>=1.0",
]

[project.scripts]
nuon-ext-install-config-history = "nuon_ext_install_config_history.cli:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
