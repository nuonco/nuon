<!doctype html>
<html
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      var nuonTheme = 'classic'
      try {
        nuonTheme = localStorage.getItem('nuon-theme') || nuonTheme
      } catch (e) {}
      if (nuonTheme !== 'system') {
        document.documentElement.setAttribute('data-theme', nuonTheme)
      }
    </script>
    <title>Nuon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4cc9f0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nuon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/assets/styles.css" data-shell="default" />
    <link rel="stylesheet" href="/assets/app.css" data-shell="default" />
    <link rel="stylesheet" href="/assets/lite.css" data-shell="lite" />
  </head>
  <body class="font-sans disable-ligatures antialiased">
    <div id="root"></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
