info:
  contact:
    email: support@nuon.co
    name: Nuon Support
  description: Admin API for managing nuon apps, components, installs, actions.
  title: Nuon Admin API
  version: 1.0.0
paths:
  /v1/action-workflows/{action_workflow_id}/admin-restart:
    post:
      consumes:
      - application/json
      description: |
        Restart an action workflow.
      operationId: AdminRestartActionWorkflow
      parameters:
      - description: action ID
        in: path
        name: action_workflow_id
        required: true
        type: string
      - description: Input
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.RestartActionWorkflowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
      security:
      - AdminEmail: []
      summary: restart an action workflow event loop
      tags:
      - actions/admin
  /v1/admin-install-workflow-step-approve:
    post:
      consumes:
      - application/json
      description: |
        Update install runner.
      operationId: AdminInstallWorkflowStepApprove
      parameters:
      - description: Input
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.AdminWorkflowStepApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.WorkflowStepApprovalResponse'
      security:
      - AdminEmail: []
      tags:
      - installs/admin
  /v1/app-branches/{app_branch_id}/admin-trigger-run:
    post:
      consumes:
      - application/json
      description: Admin endpoint to trigger a workflow run for an app branch. Uses
        the latest config.
      operationId: AdminTriggerAppBranchRun
      parameters:
      - description: app branch ID
        in: path
        name: app_branch_id
        required: true
        type: string
      - description: Input
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.AdminTriggerAppBranchRunRequest'
      produces:
      - application/json
