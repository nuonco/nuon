          schema:
            $ref: '#/definitions/app.ActionWorkflow'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
