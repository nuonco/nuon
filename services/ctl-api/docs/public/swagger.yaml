          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: delete an action workflow
      tags:
      - actions
    get:
      consumes:
      - application/json
      deprecated: true
      description: |
        Return an app action workflow by id.
      operationId: GetActionWorkflow
      parameters:
      - description: action workflow ID or name
        in: path
