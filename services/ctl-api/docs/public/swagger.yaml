info:
  contact:
    email: support@nuon.co
    name: Nuon Support
  description: API for managing nuon apps, components, installs, and actions.
  title: Nuon
  version: 1.0.0
paths:
  /v1/account:
    get:
      consumes:
      - application/json
      description: Get the current account with user journeys and other data
      operationId: GetCurrentAccount
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Account'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      summary: Get current account
      tags:
      - accounts
  /v1/account/user-journeys:
    get:
      consumes:
      - application/json
      description: Get all user journeys for the current user account
      operationId: GetUserJourneys
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app.UserJourney'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: Get user journeys
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Add a new user journey with steps to track user progress
      operationId: CreateUserJourney
      parameters:
      - description: Create journey request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreateUserJourneyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      summary: Create a new user journey for account
      tags:
      - accounts
  /v1/account/user-journeys/{journey_name}/complete:
    post:
      consumes:
      - application/json
      description: Mark all remaining steps in the specified user journey as complete
      operationId: CompleteUserJourney
      parameters:
      - description: Journey name to complete
        in: path
        name: journey_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      summary: Complete all steps in a specific user journey
      tags:
      - accounts
  /v1/account/user-journeys/{journey_name}/reset:
    post:
      consumes:
      - application/json
      description: Reset all steps in a specified user journey by setting their completion
        status to false
      operationId: ResetUserJourney
      parameters:
      - description: Journey name
        in: path
        name: journey_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: Reset user journey steps
      tags:
      - accounts
  /v1/account/user-journeys/{journey_name}/steps/{step_name}:
    patch:
      consumes:
      - application/json
      description: Mark a user journey step as complete or incomplete
      operationId: UpdateUserJourneyStep
      parameters:
      - description: Journey name
        in: path
        name: journey_name
        required: true
        type: string
      - description: Step name
        in: path
        name: step_name
        required: true
        type: string
      - description: Update step request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.UpdateUserJourneyStepRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      summary: Update user journey step completion status
      tags:
      - accounts
