info:
  contact:
    email: support@nuon.co
    name: Nuon Support
  description: API for runners.
  title: Nuon Runner API
  version: 1.0.0
paths:
  /v1/action-workflows/configs/{action_workflow_config_id}:
    get:
      consumes:
      - application/json
      deprecated: true
      description: |
        Return an action workflow config.
      operationId: GetActionWorkflowConfig
      parameters:
      - description: action workflow config ID
        in: path
        name: action_workflow_config_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.ActionWorkflowConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: get an app action workflow config
      tags:
      - actions
      - actions/runner
  /v1/apps/{app_id}/config/{app_config_id}:
    get:
      consumes:
      - application/json
      description: |
        Return an app config for the runner to use. By default recurses and loads the entire tree.
      operationId: GetRunnerAppConfig
      parameters:
      - description: app ID
        in: path
        name: app_id
        required: true
        type: string
      - description: app config ID
        in: path
        name: app_config_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.AppConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: get an app config in the runner context
      tags:
      - apps/runner
  /v1/general/metrics:
    post:
      consumes:
      - application/json
      description: |
        Publish deployment metrics from the runner.
      operationId: PublishMetrics
      parameters:
      - description: Input
        in: body
        name: req
        required: true
        schema:
          items:
            $ref: '#/definitions/service.PublishMetricInput'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      summary: Publish a metric from different Nuon clients for telemetry purposes.
      tags:
      - general/runner
  /v1/helm-releases/{helm_chart_id}/releases/{namespace}:
    get:
      consumes:
      - application/json
      description: |
        Returns all Helm releases for an install.
      operationId: GetHelmReleases
      parameters:
      - description: helm chart ID
        in: path
        name: helm_chart_id
        required: true
        type: string
      - description: namespace
        in: path
        name: namespace
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/helm.Release'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: get  helm releases
      tags:
      - runners/runner
  /v1/helm-releases/{helm_chart_id}/releases/{namespace}/{key}:
    delete:
      consumes:
      - application/json
      description: |
        Delete a Helm release from the install environment.
      operationId: DeleteHelmRelease
      parameters:
      - description: helm chart ID
        in: path
        name: helm_chart_id
        required: true
        type: string
      - description: namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app.HelmRelease'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: delete  helm release
      tags:
      - runners/runner
    get:
      consumes:
      - application/json
      description: |
        Return a Helm release by id.
      operationId: GetHelmRelease
      parameters:
      - description: helm chart ID
        in: path
        name: helm_chart_id
        required: true
        type: string
      - description: namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: key
        in: path
        name: key
        required: true
        type: string
      - default: 0
        description: offset of results to return
        in: query
        name: offset
        type: integer
      - default: 10
        description: limit of results to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: page number of results to return
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helm.Release'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: get  helm release
      tags:
      - runners/runner
    post:
      consumes:
      - application/json
      description: |
        Create a Helm release in the install environment.
      operationId: CreateHelmRelease
      parameters:
      - description: helm chart ID
        in: path
        name: helm_chart_id
        required: true
        type: string
      - description: namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: key
        in: path
        name: key
        required: true
        type: string
      - description: Input
        in: body
        name: req
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app.HelmRelease'
            type: array
