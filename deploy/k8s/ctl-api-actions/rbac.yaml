# RBAC for the ctl-api control-plane worker's service account: lets the
# kubernetes launcher (pkg/runner/launcher/kubernetes) create, exec into, read
# logs from, and delete the per-step action pods and their env secrets --
# scoped to the nuon-actions namespace only (see namespace.yaml).
#
# Set subjects[].name / namespace below to the ctl-api control-plane worker's
# actual service account before applying.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nuon-actions-launcher
  namespace: nuon-actions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nuon-actions-launcher
  namespace: nuon-actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nuon-actions-launcher
subjects:
  - kind: ServiceAccount
    # TODO: set to the ctl-api control-plane worker's service account name.
    name: ctl-api-worker
    # TODO: set to the namespace ctl-api itself runs in (not nuon-actions,
    # unless ctl-api also runs there).
    namespace: ctl-api
