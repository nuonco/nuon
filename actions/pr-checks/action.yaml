---
name: pr-check
description: |
  Runs Nuon standard PR checks
author: "@powertoolsdev/team"

inputs:
  github_token:
    description: "GITHUB_TOKEN"
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:

    - name: Lint pull request title
      if: always()
      id: title
      uses: jef/conventional-commits-pr-action@v1
      with:
        token: ${{ inputs.github_token }}

branding:
  icon: "check"
  color: "cyan"
